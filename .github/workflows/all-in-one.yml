name: All-in-one build (Windows + iPhone)

# The personal build of the fork, from the all-in-one branch:
#   * Coucou for Windows with the Claude Code chat (no API key), the music pill for
#     any player (system media session) and chats saved as Markdown files;
#   * the iPhone app that pairs with it over Wi-Fi (LAN_LINK) and chats through it.
# Everything lands in one pre-release, all-in-one-latest, replaced on every push.

on:
  push:
    branches: [all-in-one]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-in-one
  cancel-in-progress: true

env:
  TAG: all-in-one-latest

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Coucou all-in-one (Windows + iPhone)" \
            --notes "Built from ${{ github.sha }} on the all-in-one branch. Files appear here as each build finishes.

          - **Coucou-Windows-setup.exe** — install on Windows (SmartScreen: More info → Run anyway).
          - **Coucou-Windows-portable.zip** — the same without installing: unzip and run coucou.exe.
          - **Coucou-iPhone-Windows.ipa** — install with AltStore or SideStore and your Apple ID (Lock Screen / Dynamic Island with Allow and Deny). Not Sideloadly: since iOS 26 the widgets extension only launches when the installer signs it as AltStore does, and Sideloadly does not, so Mochi and the buttons never show.
          - **Coucou-iPhone-Windows-lite.ipa** — the same without widgets and Live Activity, if the full one will not install."

  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: aio-test-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: aio-test-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # Two upstream tests (strings.json, the chat picker) fail on main as well; the
      # result is shown but does not stop the build.
      - name: Island tests
        continue-on-error: true
        run: npm test
      - name: Build the relay
        run: cargo build --release -p coucou-hook
      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { node ../.github/scripts/annotate-errors.mjs test.log; exit 1 }

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: aio-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: aio-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Build and pack the installer
        shell: pwsh
        run: |
          npm run pack 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { node ../.github/scripts/annotate-errors.mjs build.log; exit 1 }
          Get-ChildItem release | Format-Table Name, Length
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Force -DestinationPath release/Coucou-Windows-portable.zip `
            -Path target/release/coucou.exe, target/release/coucou-hook.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows
          path: |
            windows/release/Coucou-Windows-setup.exe
            windows/release/Coucou-Windows-portable.zip
          retention-days: 7
      - name: Add to the pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG release/Coucou-Windows-setup.exe release/Coucou-Windows-portable.zip --clobber

  iphone:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd NotchBuddy && xcodegen
      - name: Build iPhone app (LAN link, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COUCOU_PHONE_LINK=LAN_LINK \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Show errors
        if: failure()
        run: node .github/scripts/annotate-errors.mjs build.log
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # Full: with the widgets extension, which draws the Live Activity (Lock Screen,
          # Dynamic Island, Allow / Deny), and the expanded approval notification.
          zip -qry Coucou-iPhone-Windows.ipa Payload
          # Lite: no extensions, for a signing tool or Apple ID that refuses them.
          rm -rf Payload/*.app/PlugIns
          zip -qry Coucou-iPhone-Windows-lite.ipa Payload
          ls -lh Coucou-iPhone-Windows*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-iPhone-Windows
          path: Coucou-iPhone-Windows*.ipa
          retention-days: 7
      - name: Add to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa --clobber
      # A release of its own per iPhone build number, kept when all-in-one-latest moves on.
      - name: Keep this build as its own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" NotchBuddy/Resources/InfoPhone.plist)
          KEEP="iphone-build-$BUILD"
          if gh release view "$KEEP" >/dev/null 2>&1; then
            gh release upload "$KEEP" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa --clobber
          else
            gh release create "$KEEP" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa \
              --target "${{ github.sha }}" \
              --title "Coucou iPhone build $BUILD (Windows link)" \
              --notes "Coucou for iPhone, build $BUILD, paired with Coucou for Windows over Wi-Fi: Mochi on the Lock Screen and in the Dynamic Island with Allow / Deny, and Siri (\"Allow in Coucou\" / «Разреши в Coucou»).

          Install with **AltStore or SideStore**, not Sideloadly: since iOS 26 the widgets extension only launches when the installer signs it as AltStore does, otherwise Mochi and the buttons never show.

          Built from ${{ github.sha }} on the all-in-one branch."
          fi
