name: All-in-one build (Windows + iPhone)

# The personal build of the fork, from the all-in-one branch:
#   * Coucou for Windows with the Claude Code chat (no API key), the music pill for
#     any player (system media session) and chats saved as Markdown files;
#   * the iPhone app that pairs with it over Wi-Fi (LAN_LINK) and chats through it.
# Everything lands in one pre-release, all-in-one-latest, replaced on every push.

on:
  push:
    branches: [all-in-one]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-in-one
  cancel-in-progress: true

env:
  TAG: all-in-one-latest

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Coucou all-in-one (Windows + iPhone)" \
            --notes "Built from ${{ github.sha }} on the all-in-one branch. Files appear here as each build finishes.

          - **Coucou-Windows-setup.exe** — install on Windows (SmartScreen: More info → Run anyway).
          - **Coucou-Windows-portable.zip** — the same without installing: unzip and run coucou.exe.
          - **Coucou-iPhone-Windows.ipa** — install with AltStore or SideStore and your Apple ID (Lock Screen / Dynamic Island with Allow and Deny). Not Sideloadly: since iOS 26 the widgets extension only launches when the installer signs it as AltStore does, and Sideloadly does not, so Mochi and the buttons never show.
          - **Coucou-iPhone-Windows-lite.ipa** — the same without widgets and Live Activity, if the full one will not install.
          - **Coucou-Android.apk** — Coucou for Android, paired with Coucou for Windows over Wi-Fi: open it on the phone and install."

  windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: aio-test-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: aio-test-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # Two upstream tests (strings.json, the chat picker) fail on main as well; the
      # result is shown but does not stop the build.
      - name: Island tests
        continue-on-error: true
        run: npm test
      - name: Build the relay
        run: cargo build --release -p coucou-hook
      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { node ../.github/scripts/annotate-errors.mjs test.log; exit 1 }

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: aio-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: aio-cargo-
      - name: Install dependencies
        run: npm ci
      # In-app updates (src-tauri/src/updater.rs): this build's number, and the
      # SHA-256 of the beta password (no secret: no beta switch in this build).
      - name: Build number and beta password
        shell: bash
        env:
          BETA_PASSWORD: ${{ secrets.COUCOU_BETA_PASSWORD }}
        run: |
          echo "COUCOU_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "$BETA_PASSWORD" ]; then
            hash=$(printf 'coucou-beta:%s' "$BETA_PASSWORD" | sha256sum | cut -d' ' -f1)
            echo "COUCOU_BETA_HASH=$hash" >> "$GITHUB_ENV"
          else
            echo "::warning::COUCOU_BETA_PASSWORD is not set: this build has no beta channel."
          fi
      - name: Build and pack the installer
        shell: pwsh
        run: |
          npm run pack 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { node ../.github/scripts/annotate-errors.mjs build.log; exit 1 }
          Get-ChildItem release | Format-Table Name, Length
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Force -DestinationPath release/Coucou-Windows-portable.zip `
            -Path target/release/coucou.exe, target/release/coucou-hook.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows
          path: |
            windows/release/Coucou-Windows-setup.exe
            windows/release/Coucou-Windows-portable.zip
          retention-days: 7
      - name: Add to the pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG release/Coucou-Windows-setup.exe release/Coucou-Windows-portable.zip --clobber
      # Every build goes to the beta channel; only promote-stable.yml, run by
      # hand, sends one to everybody.
      - name: Publish to the beta channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COUCOU_UPDATE_KEY: ${{ secrets.COUCOU_UPDATE_KEY }}
        run: |
          if [ -z "$COUCOU_UPDATE_KEY" ]; then
            echo "::warning::COUCOU_UPDATE_KEY is not set: this build is not offered as an update."
            exit 0
          fi
          n=${{ github.run_number }}
          tag="beta-$n"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp release/Coucou-Windows-setup.exe "release/Coucou-Windows-setup-$n.exe"
          gh release create "$tag" "release/Coucou-Windows-setup-$n.exe" --prerelease \
            --target "${{ github.sha }}" --title "Coucou beta $n" \
            --notes "Beta build $n of the all-in-one branch (${{ github.sha }}). Offered in Coucou to beta testers; promote-stable.yml sends it to everybody."
          url="https://github.com/Disa153/coucou/releases/download/$tag/Coucou-Windows-setup-$n.exe"
          notes=$(git log -1 --format=%s)
          node ../.github/scripts/sign-update.mjs --channel beta --build "$n" --version "$version" \
            --url "$url" --file "release/Coucou-Windows-setup-$n.exe" --notes "$notes" --out update.json
          gh release upload "$tag" update.json --clobber
          gh release view channel-beta >/dev/null 2>&1 || gh release create channel-beta --prerelease \
            --title "Coucou beta channel" --notes "What Coucou's beta testers are offered: update.json names the latest beta build."
          gh release upload channel-beta update.json --clobber

  android:
    needs: release
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          COUCOU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          export COUCOU_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) COUCOU_VERSION_NAME="0.2.0-fork.$GITHUB_RUN_NUMBER"
          # Signed with the fork's own key when it is set up (Settings → Secrets: ANDROID_KEYSTORE_B64 and
          # ANDROID_KEYSTORE_PASSWORD), so every new APK installs over the last one. Without it: a debug build.
          if [ -n "$KEYSTORE_B64" ] && [ -n "$COUCOU_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coucou.p12"
            export COUCOU_KEYSTORE_FILE="$RUNNER_TEMP/coucou.p12" COUCOU_KEY_ALIAS=coucou
            ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
            cp app/build/outputs/apk/release/app-release.apk Coucou-Android.apk
          else
            echo "::warning::No Android signing key in the repository's secrets: a debug APK (each one must replace the last by hand)."
            ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
            cp app/build/outputs/apk/debug/app-debug.apk Coucou-Android.apk
          fi
          ls -lh Coucou-Android.apk
      - name: Show what failed
        if: failure()
        run: |
          msg=$(grep -E "^e: |FAILED|What went wrong|Error:|error:" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build::${msg:0:60000}"
      - name: Add to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Coucou-Android.apk --clobber

  iphone:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd NotchBuddy && xcodegen
      - name: Build iPhone app (LAN link, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COUCOU_PHONE_LINK=LAN_LINK \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Show errors
        if: failure()
        run: node .github/scripts/annotate-errors.mjs build.log
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # Full: with the widgets extension, which draws the Live Activity (Lock Screen,
          # Dynamic Island, Allow / Deny), and the expanded approval notification.
          zip -qry Coucou-iPhone-Windows.ipa Payload
          # Lite: no extensions, for a signing tool or Apple ID that refuses them.
          rm -rf Payload/*.app/PlugIns
          zip -qry Coucou-iPhone-Windows-lite.ipa Payload
          ls -lh Coucou-iPhone-Windows*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-iPhone-Windows
          path: Coucou-iPhone-Windows*.ipa
          retention-days: 7
      - name: Add to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa --clobber
      # A release of its own per iPhone build number, kept when all-in-one-latest moves on.
      - name: Keep this build as its own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" NotchBuddy/Resources/InfoPhone.plist)
          KEEP="iphone-build-$BUILD"
          if gh release view "$KEEP" >/dev/null 2>&1; then
            gh release upload "$KEEP" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa --clobber
          else
            gh release create "$KEEP" Coucou-iPhone-Windows.ipa Coucou-iPhone-Windows-lite.ipa \
              --target "${{ github.sha }}" \
              --title "Coucou iPhone build $BUILD (Windows link)" \
              --notes "Coucou for iPhone, build $BUILD, paired with Coucou for Windows over Wi-Fi: Mochi on the Lock Screen and in the Dynamic Island with Allow / Deny, and Siri (\"Allow in Coucou\" / «Разреши в Coucou»).

          Install with **AltStore or SideStore**, not Sideloadly: since iOS 26 the widgets extension only launches when the installer signs it as AltStore does, otherwise Mochi and the buttons never show.

          Built from ${{ github.sha }} on the all-in-one branch."
          fi
