name: Nook Windows alpha preview

on:
  workflow_dispatch:
  push:
    branches:
      - nook-development
    paths:
      - 'windows/**'
      - '.github/workflows/nook-windows-alpha.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Windows frontend tests
        run: npm test
      - name: Build Windows installers
        run: npm run pack
      - name: Upload Nook alpha preview installers
        uses: actions/upload-artifact@v4
        with:
          name: Nook-Windows-alpha-preview
          path: |
            windows/release/Nook-Windows-*-setup.exe
            windows/release/Nook-Windows-*.msi
          if-no-files-found: error
          retention-days: 7
